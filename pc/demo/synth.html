<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spatial Air Synth · Pi-Pointer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c14;--surface:#0d1424;--border:rgba(255,255,255,.07);--text:#e8edf5;--muted:#6b7a99;
  --accent:#06b6d4;--green:#22c55e;--red:#ef4444;
  --marker-size:clamp(130px,13vw,210px);--marker-margin-x:clamp(16px,3.125vw,60px);--marker-margin-y:clamp(16px,5.556vh,60px);--marker-pad:10px;
}
body.calibrated-mode{--marker-size:15.625vw;--marker-margin-x:3.125vw;--marker-margin-y:5.556vh}
html,body{height:100%;overflow:hidden}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text)}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;touch-action:none;cursor:crosshair}

#top{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:14px;
  background:rgba(13,20,36,.88);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:100px;padding:8px 14px 8px 18px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#top a{color:var(--muted);text-decoration:none;font-size:.8rem;font-weight:500}
#top a:hover{color:var(--text)}
#top h1{font-size:.95rem;font-weight:600;white-space:nowrap}
#status{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted);white-space:nowrap}
#dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
#status.live{color:var(--text)}#status.live #dot{background:var(--green);animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:.4}}

#meters{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:22px;font-size:.78rem;color:var(--muted);white-space:nowrap}
#meters b{color:var(--text);font-weight:600}
.m{display:flex;align-items:center;gap:8px}
.bar{width:70px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
#hint{position:fixed;top:104px;left:50%;transform:translateX(-50%);z-index:50;font-size:.75rem;color:var(--muted);text-align:center;transition:opacity .6s;max-width:90vw}

#tools{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:8px;
  background:rgba(13,20,36,.9);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.btn{--p:0;position:relative;overflow:hidden;font:inherit;font-size:.8rem;font-weight:600;color:var(--text);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 16px;cursor:pointer;min-width:92px;transition:background .2s,border-color .2s}
.btn::after{content:'';position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p)*100%);background:var(--accent)}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.on{background:rgba(6,182,212,.2);border-color:var(--accent);color:#67e8f9}

#start{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(8,12,20,.72);backdrop-filter:blur(6px)}
#start.gone{display:none}
#start .btn{font-size:1.15rem;padding:22px 44px;border-radius:20px;border-color:var(--accent)}
#start p{position:absolute;margin-top:150px;color:var(--muted);font-size:.85rem}

#cur{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid #fff;z-index:2000;pointer-events:none;display:none;mix-blend-mode:difference}

#markers{position:fixed;inset:0;z-index:900;pointer-events:none;transition:opacity .25s}
#markers.hidden{opacity:0}
.aruco{position:fixed;background:#fff;padding:var(--marker-pad);border-radius:4px;box-shadow:0 10px 35px rgba(0,0,0,.75)}
.aruco img{display:block;width:var(--marker-size);height:var(--marker-size);image-rendering:pixelated}
.tl{top:var(--marker-margin-y);left:var(--marker-margin-x)}.tr{top:var(--marker-margin-y);right:var(--marker-margin-x)}
.br{bottom:var(--marker-margin-y);right:var(--marker-margin-x)}.bl{bottom:var(--marker-margin-y);left:var(--marker-margin-x)}
@media (max-width:900px){#top h1,#meters .m:nth-child(n+4){display:none}}
@media (prefers-reduced-motion:reduce){#dot{animation:none!important}}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="top">
  <a href="index.html">← Hub</a>
  <h1>Spatial Air Synth</h1>
  <div id="status"><div id="dot"></div><span id="stx">Bridge offline · mouse mode</span></div>
</div>

<div id="meters">
  <div class="m">Note <b id="m-note">–</b> <span id="m-hz">–</span></div>
  <div class="m">Volume <div class="bar"><i id="b-vol"></i></div></div>
  <div class="m">Filter <div class="bar"><i id="b-cut"></i></div> <b id="m-cut">–</b></div>
  <div class="m">Reverb <div class="bar"><i id="b-rev"></i></div></div>
</div>
<div id="hint"></div>

<div id="tools">
  <button class="btn on" id="b-sound" data-dwell title="Space">Sound: ON</button>
  <button class="btn" id="b-wave" data-dwell>Wave: Saw</button>
  <button class="btn" id="b-scale" data-dwell>Scale: Free</button>
</div>

<div id="start"><button class="btn" id="b-start" data-dwell>Start audio</button><p>Hover for 0.6 s or click to enable sound</p></div>
<div id="cur"></div>

<div id="markers">
  <div class="aruco tl"><img src="assets/marker_0.png" alt="ArUco marker 0" /></div>
  <div class="aruco tr"><img src="assets/marker_1.png" alt="ArUco marker 1" /></div>
  <div class="aruco br"><img src="assets/marker_2.png" alt="ArUco marker 2" /></div>
  <div class="aruco bl"><img src="assets/marker_3.png" alt="ArUco marker 3" /></div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ───────── input state ───────── */
const P = { x: innerWidth/2, y: innerHeight/2, sx: innerWidth/2, sy: innerHeight/2, roll: 0, tilt: 0, live: false, imu: false, down: false };
let soundOn = true, lastImuAt = 0, cutN = 0.6, revN = 0.25;  // manual fallbacks for filter and reverb (0..1)

/* ───────── bridge ───────── */
let ws, delay = 2000, timer;
function connect(){
  clearTimeout(timer);
  ws = new WebSocket('ws://localhost:8765');
  ws.onopen = () => { delay = 2000; P.live = true; $('status').classList.add('live'); $('stx').textContent = 'Bridge connected'; $('cur').style.display = 'block'; hint(); };
  let buttonHeld = false;
  function syncButton(down) {
    const pressed = !!down;
    if (pressed !== buttonHeld) {
      buttonHeld = pressed;
      if (pressed) {
        const target = document.elementFromPoint(P.x, P.y);
        const clickable = target && target.closest('[data-dwell]');
        if (clickable) clickable.click();
      }
    }
    P.down = pressed;
  }

  ws.onmessage = e => {
    let d; try { d = JSON.parse(e.data); } catch { return; }
    if (d.type === 'cursor') { P.x = clamp(d.x,0,1)*innerWidth; P.y = clamp(d.y,0,1)*innerHeight; }
    else if (d.type === 'imu' && d.r && d.r.length >= 9) {
      P.roll = Math.asin(clamp(d.r[3], -1, 1));
      P.tilt = Math.asin(clamp(-d.r[5], -1, 1));
      P.imu = true; lastImuAt = performance.now();
    }
    else if (d.type === 'button') { syncButton(d.down); }
  };
  ws.onerror = () => {};
  ws.onclose = () => {
    P.live = false; P.imu = false; $('status').classList.remove('live'); $('stx').textContent = 'Bridge offline · mouse mode'; $('cur').style.display = 'none';
    timer = setTimeout(connect, delay + Math.random()*1000); delay = Math.min(delay*1.5, 30000); hint();
  };
}
connect();

addEventListener('pointermove', e => { if (!P.live) { P.x = e.clientX; P.y = e.clientY; } });
addEventListener('pointerdown', e => { if (!e.target.closest('.btn')) P.down = true; });
addEventListener('pointerup', () => { P.down = false; });
addEventListener('wheel', e => {
  const d = -e.deltaY * 0.001;
  if (e.shiftKey) revN = clamp(revN + d*2, 0, 1); else cutN = clamp(cutN + d*2, 0, 1);
}, { passive: true });

/* ───────── audio ───────── */
let ac, osc, sub, filt, dry, wet, master, analyser, wave = 0, scaleIdx = 0;
const WAVES = [['Saw','sawtooth'],['Square','square'],['Triangle','triangle'],['Sine','sine']];
const NOTE = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
// scales as semitone offsets from A2 (110 Hz) over 3 octaves
const SCALES = [
  { name: 'Free', steps: null },
  { name: 'Pentatonic', steps: [0,3,5,7,10] },
  { name: 'Major', steps: [0,2,4,5,7,9,11] },
  { name: 'Minor', steps: [0,2,3,5,7,8,10] }
];
const OCT = 3, BASE = 110;
function notesFor(s){ const out = []; for (let o = 0; o < OCT; o++) for (const n of s.steps) out.push(o*12 + n); out.push(OCT*12); return out; }

function startAudio(){
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  osc = ac.createOscillator(); osc.type = WAVES[wave][1];
  sub = ac.createOscillator(); sub.type = 'sine';
  const subG = ac.createGain(); subG.gain.value = 0.45;
  filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.Q.value = 6;
  dry = ac.createGain(); wet = ac.createGain();
  const rev = ac.createConvolver(); rev.buffer = impulse(2.4);
  master = ac.createGain(); master.gain.value = 0;
  analyser = ac.createAnalyser(); analyser.fftSize = 1024;
  osc.connect(filt); sub.connect(subG).connect(filt);
  filt.connect(dry).connect(master); filt.connect(rev).connect(wet).connect(master);
  master.connect(analyser).connect(ac.destination);
  osc.start(); sub.start();
  $('start').classList.add('gone'); hint();
}
function impulse(sec){
  const n = ac.sampleRate*sec, b = ac.createBuffer(2, n, ac.sampleRate);
  for (let c = 0; c < 2; c++){ const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/n, 2.8); }
  return b;
}

/* pitch for a normalized x (0..1) → { freq, note, col } */
function pitchAt(nx){
  const s = SCALES[scaleIdx];
  if (!s.steps) { const semi = nx*OCT*12; return { freq: BASE*Math.pow(2, semi/12), semi }; }
  const list = notesFor(s), i = Math.min(list.length - 1, Math.floor(nx*list.length));
  return { freq: BASE*Math.pow(2, list[i]/12), semi: list[i], col: i, cols: list.length };
}
function noteName(semi){ const m = (Math.round(semi) + 9) % 12; return NOTE[m] + (2 + Math.floor((Math.round(semi) + 9)/12)); }

/* ───────── controls ───────── */
$('b-start').onclick = startAudio;
$('b-sound').onclick = () => { soundOn = !soundOn; $('b-sound').textContent = 'Sound: ' + (soundOn ? 'ON' : 'OFF'); $('b-sound').classList.toggle('on', soundOn); };
$('b-wave').onclick = () => { wave = (wave + 1) % WAVES.length; $('b-wave').textContent = 'Wave: ' + WAVES[wave][0]; if (osc) osc.type = WAVES[wave][1]; };
$('b-scale').onclick = () => { scaleIdx = (scaleIdx + 1) % SCALES.length; $('b-scale').textContent = 'Scale: ' + SCALES[scaleIdx].name; $('b-scale').classList.toggle('on', scaleIdx > 0); };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!ac) startAudio(); else $('b-sound').click(); }
  else if (e.key === 'w' || e.key === 'W') $('b-wave').click();
  else if (e.key === 's' || e.key === 'S') $('b-scale').click();
  else if (e.key === 'm' || e.key === 'M') $('markers').classList.toggle('hidden');
  else if (e.key === 'c' || e.key === 'C') document.body.classList.toggle('calibrated-mode');
  else if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
});

let hintTimer;
function hint(){
  const h = $('hint'); h.style.opacity = 1;
  h.textContent = !ac ? '' : P.live
    ? 'Left–right sets pitch, up–down sets volume. Roll your wrist for filter, tilt forward or back for reverb.'
    : 'Hold the mouse and move to play · scroll for filter · Shift+scroll for reverb · W wave · S scale';
  clearTimeout(hintTimer); hintTimer = setTimeout(() => h.style.opacity = 0, 8000);
}

/* dwell selection (hover 600 ms to click) */
let dwellEl = null, dwellStart = 0, dwellCool = 0;
function dwell(now){
  if (!P.live) return;
  const el = document.elementFromPoint(P.sx, P.sy)?.closest('[data-dwell]');
  if (el && el !== dwellEl && now > dwellCool) { dwellEl = el; dwellStart = now; }
  if (!el || el !== dwellEl) { if (dwellEl) dwellEl.style.setProperty('--p', 0); dwellEl = null; return; }
  const p = clamp((now - dwellStart)/600, 0, 1);
  el.style.setProperty('--p', p);
  if (p >= 1) { el.click(); el.style.setProperty('--p', 0); dwellEl = null; dwellCool = now + 900; }
}

/* ───────── visuals ───────── */
const cv = $('cv'), ctx = cv.getContext('2d');
let dpr = 1, W = 0, H = 0;
function size(){ dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
size(); addEventListener('resize', size);

const buf = new Uint8Array(1024);
let vol = 0, smoothCut = 0.6, smoothRev = 0.25;
function drawScene(freq, semi){
  ctx.clearRect(0,0,W,H);
  // volume gradient: bright at top, dark at bottom
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'rgba(6,182,212,.14)'); g.addColorStop(1,'rgba(6,182,212,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // pitch columns
  const s = SCALES[scaleIdx];
  ctx.lineWidth = 1; ctx.font = '500 11px Outfit, sans-serif'; ctx.fillStyle = 'rgba(148,163,184,.7)'; ctx.textAlign = 'center';
  if (s.steps) {
    const list = notesFor(s), cw = W/list.length;
    list.forEach((n, i) => {
      ctx.strokeStyle = i % s.steps.length === 0 ? 'rgba(6,182,212,.35)' : 'rgba(255,255,255,.06)';
      ctx.beginPath(); ctx.moveTo(i*cw, 0); ctx.lineTo(i*cw, H); ctx.stroke();
      ctx.fillText(noteName(n), i*cw + cw/2, 150);
    });
  } else {
    for (let o = 0; o <= OCT; o++){ const x = W*o/OCT; ctx.strokeStyle = 'rgba(6,182,212,.3)'; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); ctx.fillText(noteName(o*12), Math.min(W-16, x+16), 150); }
  }

  // oscilloscope
  const mid = H*0.5, amp = H*0.32*(0.25 + vol*0.9);
  if (analyser) analyser.getByteTimeDomainData(buf); else buf.fill(128);
  // trigger on rising zero-cross for a stable trace
  let t0 = 0; for (let i = 1; i < 512; i++) if (buf[i-1] < 128 && buf[i] >= 128) { t0 = i; break; }
  ctx.beginPath();
  for (let i = 0; i < 512; i++){
    const x = i/511*W, y = mid + ((buf[t0 + i] - 128)/128)*amp*3;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.lineJoin = 'round'; ctx.lineWidth = 2.5; ctx.strokeStyle = `rgba(103,232,249,${0.35 + vol*0.65})`;
  ctx.shadowColor = '#06b6d4'; ctx.shadowBlur = 8 + vol*22; ctx.stroke(); ctx.shadowBlur = 0;

  // pitch marker line at pointer
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.moveTo(P.sx, 0); ctx.lineTo(P.sx, H); ctx.stroke();
}

/* ───────── main loop ───────── */
function frame(now){
  P.sx += (P.x - P.sx)*0.5; P.sy += (P.y - P.sy)*0.5;
  const imuOn = P.imu && now - lastImuAt < 1000;
  const nx = clamp(P.sx/W, 0, 1), ny = clamp(P.sy/H, 0, 1);
  const pt = pitchAt(nx);
  const playing = soundOn && (P.down || P.live) && !document.elementFromPoint(P.sx, P.sy)?.closest('#tools,#top,#start');
  const tv = playing ? Math.pow(1 - ny, 1.4) : 0;
  vol += (tv - vol)*0.2;

  // wrist roll → filter, forward/back tilt → reverb (wheel is the mouse fallback)
  const tCut = imuOn ? clamp((P.roll + 0.8)/1.6, 0, 1) : cutN;
  const tRev = imuOn ? clamp((P.tilt + 0.6)/1.2, 0, 1) : revN;
  smoothCut += (tCut - smoothCut)*0.15; smoothRev += (tRev - smoothRev)*0.15;
  const cutHz = 250*Math.pow(32, smoothCut);  // 250 Hz … 8 kHz

  if (ac) {
    const t = ac.currentTime;
    osc.frequency.setTargetAtTime(pt.freq, t, 0.025);
    sub.frequency.setTargetAtTime(pt.freq/2, t, 0.025);
    filt.frequency.setTargetAtTime(cutHz, t, 0.03);
    master.gain.setTargetAtTime(vol*0.35, t, 0.03);
    wet.gain.setTargetAtTime(smoothRev*1.1, t, 0.05);
    dry.gain.setTargetAtTime(1 - smoothRev*0.5, t, 0.05);
  }

  $('m-note').textContent = noteName(pt.semi); $('m-hz').textContent = pt.freq.toFixed(0) + ' Hz';
  $('b-vol').style.width = (vol*100) + '%'; $('b-cut').style.width = (smoothCut*100) + '%'; $('b-rev').style.width = (smoothRev*100) + '%';
  $('m-cut').textContent = cutHz >= 1000 ? (cutHz/1000).toFixed(1) + 'k' : cutHz.toFixed(0);

  drawScene(pt.freq, pt.semi);
  if (P.live) $('cur').style.transform = `translate(${P.sx}px,${P.sy}px) scale(${1 + vol*1.2})`;
  dwell(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
